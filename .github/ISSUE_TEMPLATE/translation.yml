name: Translation review or new language
description: Suggest a correction or propose a new Narabi localization
title: "[Translation] "
labels: ["localization"]
body:
  - type: input
    id: locale
    attributes:
      label: Locale
      description: Include the locale code and regional variant, for example pt-BR or zh-Hant.
    validations:
      required: true
  - type: dropdown
    id: request
    attributes:
      label: Request type
      options:
        - Review or correct existing text
        - Review the localized app name
        - Add a new language
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Localization key
      description: Leave blank only for a broad review or a new-language proposal.
  - type: textarea
    id: current
    attributes:
      label: Current text
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Reason and usage context
      description: Explain naturalness, regional usage, tone, screen location, or why the current text is misleading.
    validations:
      required: true
  - type: dropdown
    id: familiarity
    attributes:
      label: Familiarity with the language
      options:
        - Native speaker
        - Fluent or professional use
        - Regular use
        - Learner
        - Machine-assisted proposal
        - Prefer not to say
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I preserved placeholders such as `%@`, `%lld`, and `%1$@`.
        - label: I did not translate keys, product IDs, bundle IDs, or file names.
        - label: I identified the correct regional variant.
