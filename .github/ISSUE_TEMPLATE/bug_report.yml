name: Bug report
description: Report a reproducible Narabi problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential documents, credentials, or personal information.
  - type: input
    id: environment
    attributes:
      label: App version, device, and OS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
