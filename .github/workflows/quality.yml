name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-audit:
    name: Repository audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: chmod +x Scripts/audit_all.sh
      - run: ./Scripts/audit_all.sh

  unit-tests:
    name: iOS unit tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          destination="$(python3 - <<'PY2'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          candidates.sort(reverse=True)
          print(f"platform=iOS Simulator,id={candidates[0][1]}")
          PY2
          )"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
      - name: Run NarabiTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Narabi.xcodeproj \
            -scheme Narabi \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -only-testing:NarabiTests \
            CODE_SIGNING_ALLOWED=NO


  ui-smoke-tests:
    name: iOS UI smoke tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); x=[v for a in d["devices"].values() for v in a if v.get("isAvailable") and v.get("name","").startswith("iPhone")]; print(x[0]["udid"] if x else "")')"
          test -n "$udid"
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
      - name: Run UI smoke tests
        run: |
          xcodebuild test             -project Narabi.xcodeproj             -scheme Narabi             -destination "${{ steps.simulator.outputs.destination }}"             -only-testing:NarabiUITests             CODE_SIGNING_ALLOWED=NO
